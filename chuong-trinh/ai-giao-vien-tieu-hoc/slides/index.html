/* Trình xem slide: thanh trên, sân khấu 16:9 tự co, điều hướng bằng nút, phím và vuốt. */
:root{
  --bg:#0E1626; --bar:#121D31; --line:#26354F; --ink:#EEF1F6; --muted:#A9B5C8;
  --flame:#19A67E; --brand:#4FA6EE;
  --f:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f);
  display:flex; flex-direction:column; min-height:100dvh;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased}
a{color:inherit}
.bar{display:flex; align-items:center; gap:12px; padding:10px max(16px,env(safe-area-inset-left,0px));
  background:var(--bar); border-bottom:1px solid var(--line); flex:none}
.brand{display:flex; align-items:center; gap:9px; text-decoration:none}
.brand svg{flex:none; display:block}
.brand b{font-weight:800; font-size:14.5px; letter-spacing:-.02em}
.brand b span{color:var(--brand); font-weight:500}
.ttl{font-size:14px; color:var(--muted); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.ttl::before{content:"·"; margin-right:10px; color:var(--line)}
.sp{flex:1}
.pill{font-size:13px; font-weight:700; text-decoration:none; padding:7px 13px; border-radius:999px;
  border:1px solid var(--line); color:var(--ink); white-space:nowrap}
.pill:hover{border-color:var(--muted)}
.pill.hot{background:var(--flame); border-color:var(--flame); color:#17233B}
@media (max-width:760px){.ttl,.pill.dl{display:none}}
@media (max-width:420px){.pill.back span{display:none}}

.stage{flex:1; display:flex; align-items:center; justify-content:center; padding:20px 16px 8px; min-height:0}
.frame{position:relative; width:min(100%, calc((100dvh - 170px) * 16 / 9)); aspect-ratio:16/9;
  border-radius:12px; overflow:hidden; background:#000; box-shadow:0 20px 60px -20px rgba(0,0,0,.7);
  touch-action:pan-y}
.frame img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block;
  opacity:0; transition:opacity .25s ease}
.frame img.on{opacity:1}
@media (prefers-reduced-motion: reduce){.frame img{transition:none}}
.nav{position:absolute; top:0; bottom:0; width:22%; border:0; background:transparent; cursor:pointer; padding:0}
.nav.prev{left:0} .nav.next{right:0}
.nav:focus-visible{outline:3px solid var(--flame); outline-offset:-3px}

.ctrl{display:flex; align-items:center; justify-content:center; gap:14px; padding:6px 16px 18px; flex:none}
.btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--bar);
  color:var(--ink); display:grid; place-items:center; cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.35; cursor:default}
.btn svg{width:22px; height:22px}
.count{font-variant-numeric:tabular-nums; font-weight:700; font-size:15px; min-width:64px; text-align:center}
.count span{color:var(--muted); font-weight:500}
.dots{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:340px}
.dot{width:8px; height:8px; border-radius:50%; background:var(--line); border:0; padding:0; cursor:pointer}
.dot.on{background:var(--flame)}
@media (max-width:520px){.dots{display:none}}
.note{text-align:center; font-size:12.5px; color:var(--muted); padding:0 16px 14px; margin:0}

<div class="ctrl">
  <button class="btn" id="prev" aria-label="Slide trước"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <div class="count" aria-live="polite"><b id="cur">1</b> <span>/ <span id="tot">10</span></span></div>
  <button class="btn" id="next" aria-label="Slide sau"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>

</div>
<p class="note">Bản xem trước 9 / 21 slide · Dùng phím ← → hoặc vuốt để chuyển slide</p>

<script>
(function(){
  var imgs=[].slice.call(document.querySelectorAll('#frame img'));
  var n=imgs.length, i=0, dots=document.getElementById('dots');
  imgs.forEach(function(_,k){
    var d=document.createElement('button'); d.className='dot'; d.setAttribute('aria-label','Đến slide '+(k+1));
    d.onclick=function(){go(k)}; dots.appendChild(d);
  });
  function load(k){ var im=imgs[k]; if(im && im.dataset.src){ im.src=im.dataset.src; delete im.dataset.src; } }
  function go(k){
    k=Math.max(0,Math.min(n-1,k));
    imgs[i].classList.remove('on'); i=k; load(i); imgs[i].classList.add('on');
    load(i+1); load(i-1);
    document.getElementById('cur').textContent=i+1;
    document.getElementById('prev').disabled=i===0;
    document.getElementById('next').disabled=i===n-1;
    [].forEach.call(dots.children,function(d,j){d.classList.toggle('on',j===i)});
    if(history.replaceState) history.replaceState(null,'','#'+(i+1));
  }
  document.getElementById('tot').textContent=n;
  document.getElementById('prev').onclick=function(){go(i-1)};
  document.getElementById('next').onclick=function(){go(i+1)};
  document.getElementById('tapPrev').onclick=function(){go(i-1)};
  document.getElementById('tapNext').onclick=function(){go(i+1)};
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(i+1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}
    else if(e.key==='Home'){go(0)} else if(e.key==='End'){go(n-1)}
  });
  var x0=null, f=document.getElementById('frame');
  f.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  f.addEventListener('touchend',function(e){
    if(x0===null)return; var dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>40) go(dx<0?i+1:i-1);
  });
  var h=parseInt((location.hash||'').slice(1),10);
  go(h>=1&&h<=n ? h-1 : 0);
})();
</script>
